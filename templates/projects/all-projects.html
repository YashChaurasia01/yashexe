<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Dynamic Portfolio Showcase</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <style>
    :root {
      --glow-color: 132, 0, 255; 
      --glow-radius: 300px;
      --border-color: #2F293A;
      --background-dark: #120F17;
      --white: hsl(0, 0%, 100%);
    }

    body {
      background-color: #0b090e;
      font-family: ui-sans-serif, system-ui, sans-serif;
    }

    /* Master Layout Container holding exactly 2 projects per row on desktop */
    .portfolio-master-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3rem;
      width: 100%;
      max-width: 120rem;
      margin: 0 auto;
      padding: 1.5rem;
    }

    @media (min-width: 1280px) {
      .portfolio-master-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Outer Card Wrapper (Borders and padding added around each project) */
    .project-container-card {
      background-color: #0d0a12;
      border: 1px solid #1f1a26;
      border-radius: 28px;
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .project-container-card:hover {
      border-color: #2b2336;
      box-shadow: 0 15px 40px rgba(132, 0, 255, 0.05);
    }

    /* Inner Asymmetric 5-Box Bento Grid Architecture */
    .bento-card-group {
      --glow-x: 50%;
      --glow-y: 50%;
      --glow-intensity: 0;
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.75rem;
      width: 100%;
    }
    
    @media (min-width: 640px) {
      .bento-card-group {
        grid-template-columns: repeat(4, 1fr);
        grid-auto-rows: minmax(110px, auto);
      }
      
      .bento-card-group .box-video {
        grid-column: span 3;
        grid-row: span 3;
        min-height: 360px;
      }
      
      .bento-card-group .box-title {
        grid-column: span 1;
        grid-row: span 1;
      }
      
      .bento-card-group .box-desc {
        grid-column: span 1;
        grid-row: span 2;
      }
      
      .bento-card-group .box-git,
      .bento-card-group .box-link {
        grid-column: span 2;
        grid-row: span 1;
        min-height: 90px;
      }
    }
    
    /* MagicBento Custom Border Glow Mechanics */
    .card--border-glow::after {
      content: '';
      position: absolute;
      inset: 0;
      padding: 6px;
      background: radial-gradient(var(--glow-radius) circle at var(--glow-x) var(--glow-y),
          rgba(var(--glow-color), calc(var(--glow-intensity) * 0.8)) 0%,
          rgba(var(--glow-color), calc(var(--glow-intensity) * 0.4)) 30%,
          transparent 60%);
      border-radius: inherit;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
      opacity: 1;
      transition: opacity 0.3s ease;
      z-index: 5;
    }
    
    .card--border-glow:hover {
      box-shadow: 0 4px 20px rgba(46, 24, 78, 0.4), 0 0 30px rgba(var(--glow-color), 0.2);
    }
    
    /* Star Particles Layer */
    .particle::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: rgba(var(--glow-color), 0.2);
      border-radius: 50%;
      z-index: -1;
    }

    .card-content-wrapper {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* --- UNIFIED RE-THEMED UIVERSE BUTTON SYSTEM --- */
    .uiverse-btn {
      position: relative;
      padding: 10px 24px;
      background: rgba(132, 0, 255, 0.2);
      font-size: 14px;
      font-weight: 500;
      color: #dfccf2;
      border: 2px solid rgba(132, 0, 255, 0.6);
      border-radius: 12px;
      box-shadow: 0 0 0 rgba(132, 0, 255, 0);
      transition: all 0.3s ease-in-out;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: visible;
    }

    .star-1, .star-2, .star-3, .star-4, .star-5, .star-6 {
      position: absolute;
      width: 15px;
      height: auto;
      filter: drop-shadow(0 0 0 #fffdef);
      z-index: -5;
      pointer-events: none;
      opacity: 0;
    }
    .star-1 { top: 20%; left: 20%; width: 20px; transition: all 1s cubic-bezier(0.05, 0.83, 0.43, 0.96); }
    .star-2 { top: 45%; left: 45%; width: 12px; transition: all 1s cubic-bezier(0, 0.4, 0, 1.01); }
    .star-3 { top: 40%; left: 40%; width: 6px;  transition: all 1s cubic-bezier(0, 0.4, 0, 1.01); }
    .star-4 { top: 20%; left: 40%; width: 8px;  transition: all 0.8s cubic-bezier(0, 0.4, 0, 1.01); }
    .star-5 { top: 25%; left: 45%; width: 12px; transition: all 0.6s cubic-bezier(0, 0.4, 0, 1.01); }
    .star-6 { top: 5%;  left: 50%; width: 6px;  transition: all 0.8s ease; }

    .fil0 {
      fill: #e1ccff;
    }

    .uiverse-btn:hover {
      background: transparent;
      color: #ffffff;
      border-color: rgba(132, 0, 255, 1);
      box-shadow: 0 0 25px rgba(132, 0, 255, 0.4);
    }
    
    .uiverse-btn:hover .star-1, .uiverse-btn:hover .star-2, .uiverse-btn:hover .star-3, 
    .uiverse-btn:hover .star-4, .uiverse-btn:hover .star-5, .uiverse-btn:hover .star-6 {
      opacity: 1;
      z-index: 20;
    }
    .uiverse-btn:hover .star-1 { top: -70%; left: -15%; filter: drop-shadow(0 0 6px #bf99ff); }
    .uiverse-btn:hover .star-2 { top: -25%; left: 15%;  filter: drop-shadow(0 0 6px #bf99ff); }
    .uiverse-btn:hover .star-3 { top: 75%;  left: 20%;  filter: drop-shadow(0 0 4px #bf99ff); }
    .uiverse-btn:hover .star-4 { top: 40%;  left: 85%;  filter: drop-shadow(0 0 4px #bf99ff); }
    .uiverse-btn:hover .star-5 { top: 15%;  left: 105%; filter: drop-shadow(0 0 6px #bf99ff); }
    .uiverse-btn:hover .star-6 { top: -15%; left: 55%;  filter: drop-shadow(0 0 4px #bf99ff); }
  </style>
</head>
<body class="flex flex-col items-center justify-start min-h-screen py-16 px-4">

  <main id="portfolio-root" class="portfolio-master-grid"></main>

  <script>
    const globalProps = {
      enableStars: true,
      enableSpotlight: true,
      enableBorderGlow: true,
      spotlightRadius: 300,
      particleCount: 10,
      enableTilt: true,
      glowColor: "132, 0, 255", 
      clickEffect: true,
      enableMagnetism: true,
      disableAnimations: false
    };

    // --- YOUR DATA SOURCE ARRAY STATE ENGINE ---
    const projectsDataset = [
      {
        video: "https://assets.mixkit.co/videos/preview/mixkit-abstract-laser-lights-background-42098-large.mp4",
        title: 'Project Nebula',
        description: 'Advanced real-time modular control layer optimizing hyper-threaded canvas pipelines and low latency matrix transformations.',
        github: 'https://github.com',
        link: 'https://google.com'
      },
      {
        video: "https://assets.mixkit.co/videos/preview/mixkit-tunnel-of-futuristic-blue-lights-42081-large.mp4",
        title: 'Quantum Grid',
        description: 'Facial tracking cluster optimization executing cross-platform webassembly binaries on enterprise cluster nodes seamlessly.',
        github: 'https://github.com',
        link: 'https://google.com'
      },
      {
        video: "https://assets.mixkit.co/videos/preview/mixkit-flowing-neon-glowing-lines-background-42111-large.mp4",
        title: 'Hyperledger Hub',
        description: 'Pluggable architectural abstraction mapping transaction consensus records across highly distributed permissioned environments.',
        github: 'https://github.com',
        link: 'https://google.com'
      }
    ];

    // Shared Reusable Uiverse Vector Burst Template Layout Helper String
    const getBurstStarsMarkup = () => `
      <div class="star-1"><svg viewBox="0 0 784.11 815.53"><path class="fil0" d="M392.05 0c-20.9,210.08 -184.06,378.41 -392.05,407.78 207.96,29.37 371.12,197.68 392.05,407.74 20.93,-210.06 184.09,-378.37 392.05,-407.74 -207.98,-29.38 -371.16,-197.69 -392.06,-407.78z"/></svg></div>
      <div class="star-2"><svg viewBox="0 0 784.11 815.53"><path class="fil0" d="M392.05 0c-20.9,210.08 -184.06,378.41 -392.05,407.78 207.96,29.37 371.12,197.68 392.05,407.74 20.93,-210.06 184.09,-378.37 392.05,-407.74 -207.98,-29.38 -371.16,-197.69 -392.06,-407.78z"/></svg></div>
      <div class="star-3"><svg viewBox="0 0 784.11 815.53"><path class="fil0" d="M392.05 0c-20.9,210.08 -184.06,378.41 -392.05,407.78 207.96,29.37 371.12,197.68 392.05,407.74 20.93,-210.06 184.09,-378.37 392.05,-407.74 -207.98,-29.38 -371.16,-197.69 -392.06,-407.78z"/></svg></div>
      <div class="star-4"><svg viewBox="0 0 784.11 815.53"><path class="fil0" d="M392.05 0c-20.9,210.08 -184.06,378.41 -392.05,407.78 207.96,29.37 371.12,197.68 392.05,407.74 20.93,-210.06 184.09,-378.37 392.05,-407.74 -207.98,-29.38 -371.16,-197.69 -392.06,-407.78z"/></svg></div>
      <div class="star-5"><svg viewBox="0 0 784.11 815.53"><path class="fil0" d="M392.05 0c-20.9,210.08 -184.06,378.41 -392.05,407.78 207.96,29.37 371.12,197.68 392.05,407.74 20.93,-210.06 184.09,-378.37 392.05,-407.74 -207.98,-29.38 -371.16,-197.69 -392.06,-407.78z"/></svg></div>
      <div class="star-6"><svg viewBox="0 0 784.11 815.53"><path class="fil0" d="M392.05 0c-20.9,210.08 -184.06,378.41 -392.05,407.78 207.96,29.37 371.12,197.68 392.05,407.74 20.93,-210.06 184.09,-378.37 392.05,-407.74 -207.98,-29.38 -371.16,-197.69 -392.06,-407.78z"/></svg></div>
    `;

    // Modern Minimalist Inline SVG Icon Definitions
    const SVGIcons = {
      github: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"></path><path d="M9 18c-4.51 2-5-2-7-2"></path></svg>`,
      external: `<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"></path><path d="M10 14 21 3"></path><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg>`
    };

    const MOBILE_BREAKPOINT = 768;
    let isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
    const shouldDisableAnimations = globalProps.disableAnimations || isMobile;

    document.documentElement.style.setProperty('--glow-color', globalProps.glowColor);
    document.documentElement.style.setProperty('--glow-radius', `${globalProps.spotlightRadius}px`);

    const portfolioRoot = document.getElementById('portfolio-root');

    // --- Dynamic DOM Generation Loop Engine ---
    function compilePortfolioShowcase(dataset) {
      portfolioRoot.innerHTML = ''; 
      
      dataset.forEach((data) => {
        const masterCardNode = document.createElement('div');
        masterCardNode.className = 'project-container-card';

        const bentoGroupNode = document.createElement('div');
        bentoGroupNode.className = 'bento-card-group';
        
        const cardStyleText = `background-color: var(--background-dark); border-color: var(--border-color); color: var(--white);`;
        const cardBaseClass = `card-element ${globalProps.enableBorderGlow ? 'card--border-glow' : ''} relative p-5 rounded-[20px] border border-solid font-light overflow-hidden flex flex-col justify-between transition-transform duration-300 ease-in-out hover:-translate-y-0.5`;

        bentoGroupNode.innerHTML = `
          <div class="${cardBaseClass} box-video" style="${cardStyleText}">
            <video class="absolute inset-0 w-full h-full object-cover opacity-35 pointer-events-none z-0" autoplay loop muted playsinline>
              <source src="${data.video}" type="video/mp4">
            </video>
            <div class="card-content-wrapper">
              <div class="text-xs tracking-wider opacity-50 uppercase font-medium">System Environment</div>
              <div>
                <h2 class="text-xl font-medium tracking-tight mb-1 text-white/90">Architecture Preview</h2>
                <p class="text-xs opacity-70 max-w-xs">Live deployment layout streaming active pipeline parameters.</p>
              </div>
            </div>
          </div>

          <div class="${cardBaseClass} box-title" style="${cardStyleText}">
            <div class="card-content-wrapper justify-center items-start">
              <span class="text-[10px] uppercase tracking-widest opacity-40 mb-1">Project Build</span>
              <h1 class="text-lg font-semibold tracking-tight text-purple-400">${data.title}</h1>
            </div>
          </div>

          <div class="${cardBaseClass} box-desc" style="${cardStyleText}">
            <div class="card-content-wrapper">
              <span class="text-xs opacity-40 uppercase tracking-wider">Telemetry</span>
              <div class="mt-2">
                <h3 class="text-xs font-semibold uppercase text-neutral-400 tracking-wide mb-1">Scope</h3>
                <p class="text-[11px] leading-relaxed opacity-75">${data.description}</p>
              </div>
            </div>
          </div>

          <div class="${cardBaseClass} box-git" style="${cardStyleText}">
            <div class="card-content-wrapper flex-row items-center justify-between gap-4">
              <div class="flex flex-col justify-center">
                <h3 class="text-sm font-medium text-neutral-200">Repository</h3>
                <p class="text-[11px] opacity-50 leading-tight">View file tree blueprints</p>
              </div>
              <a href="${data.github}" target="_blank" class="uiverse-btn no-underline">
                ${SVGIcons.github}
                <span>Source</span>
                ${getBurstStarsMarkup()}
              </a>
            </div>
          </div>

          <div class="${cardBaseClass} box-link" style="${cardStyleText}">
            <div class="card-content-wrapper flex-row items-center justify-between gap-4">
              <div class="flex flex-col justify-center">
                <h3 class="text-sm font-medium text-neutral-200">Production</h3>
                <p class="text-[11px] opacity-50 leading-tight">Interact with environment</p>
              </div>
              <a href="${data.link}" target="_blank" class="uiverse-btn no-underline">
                ${SVGIcons.external}
                <span>Launch</span>
                ${getBurstStarsMarkup()}
              </a>
            </div>
          </div>
        `;

        masterCardNode.appendChild(bentoGroupNode);
        portfolioRoot.appendChild(masterCardNode);
        
        initializeBentoInteractivity(bentoGroupNode);
      });
    }

    // --- Interactive Hover & Particle Tracking Engine ---
    const createParticleElement = (x, y, color) => {
      const el = document.createElement('div');
      el.className = 'particle';
      el.style.cssText = `
        position: absolute; width: 4px; height: 4px; border-radius: 50%;
        background: rgba(${color}, 1); box-shadow: 0 0 6px rgba(${color}, 0.6);
        pointer-events: none; z-index: 8; left: ${x}px; top: ${y}px;
      `;
      return el;
    };

    function initializeBentoInteractivity(groupContainer) {
      if (shouldDisableAnimations) return;

      const items = groupContainer.querySelectorAll('.card-element');

      items.forEach((cardEl) => {
        let timeouts = [];
        let activeParticles = [];
        let memoizedParticles = [];
        let particlesInitialized = false;
        let magnetismTween = null;
        let isHovered = false;

        const initializeParticles = () => {
          if (particlesInitialized) return;
          const rect = cardEl.getBoundingClientRect();
          memoizedParticles = Array.from({ length: globalProps.particleCount }, () =>
            createParticleElement(Math.random() * rect.width, Math.random() * rect.height, globalProps.glowColor)
          );
          particlesInitialized = true;
        };

        const clearAllParticles = () => {
          timeouts.forEach(clearTimeout);
          timeouts = [];
          if (magnetismTween) magnetismTween.kill();
          activeParticles.forEach(p => gsap.to(p, { scale: 0, opacity: 0, duration: 0.3, onComplete: () => p.remove() }));
          activeParticles = [];
        };

        const animateParticles = () => {
          if (!isHovered) return;
          if (!particlesInitialized) initializeParticles();

          memoizedParticles.forEach((particle, idx) => {
            const timeoutId = setTimeout(() => {
              if (!isHovered) return;
              const clone = particle.cloneNode(true);
              cardEl.appendChild(clone);
              activeParticles.push(clone);

              gsap.fromTo(clone, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3 });
              gsap.to(clone, {
                x: (Math.random() - 0.5) * 60,
                y: (Math.random() - 0.5) * 60,
                duration: 2 + Math.random() * 2,
                ease: 'none',
                repeat: -1,
                yoyo: true
              });
            }, idx * 100);
            timeouts.push(timeoutId);
          });
        };

        cardEl.addEventListener('mouseenter', () => {
          isHovered = true;
          if (globalProps.enableStars) animateParticles();
          if (globalProps.enableTilt) {
            gsap.to(cardEl, { rotateX: 3, rotateY: 3, duration: 0.3, ease: 'power2.out', transformPerspective: 1000 });
          }
        });

        cardEl.addEventListener('mouseleave', () => {
          isHovered = false;
          if (globalProps.enableStars) clearAllParticles();
          if (globalProps.enableTilt) gsap.to(cardEl, { rotateX: 0, rotateY: 0, duration: 0.3, ease: 'power2.out' });
          if (globalProps.enableMagnetism) gsap.to(cardEl, { x: 0, y: 0, duration: 0.3, ease: 'power2.out' });
        });

        cardEl.addEventListener('mousemove', (e) => {
          const rect = cardEl.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;

          if (globalProps.enableTilt) {
            const rotateX = ((y - centerY) / centerY) * -5;
            const rotateY = ((x - centerX) / centerX) * 5;
            gsap.to(cardEl, { rotateX, rotateY, duration: 0.1, ease: 'power2.out' });
          }

          if (globalProps.enableMagnetism) {
            const magnetX = (x - centerX) * 0.025;
            const magnetY = (y - centerY) * 0.025;
            magnetismTween = gsap.to(cardEl, { x: magnetX, y: magnetY, duration: 0.3, ease: 'power2.out' });
          }
        });

        cardEl.addEventListener('click', (e) => {
          if (!globalProps.clickEffect) return;
          const rect = cardEl.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          const maxDistance = Math.max(Math.hypot(x, y), Math.hypot(x - rect.width, y - rect.height));

          const ripple = document.createElement('div');
          ripple.style.cssText = `
            position: absolute; width: ${maxDistance * 2}px; height: ${maxDistance * 2}px; border-radius: 50%;
            background: radial-gradient(circle, rgba(${globalProps.glowColor}, 0.25) 0%, transparent 70%);
            left: ${x - maxDistance}px; top: ${y - maxDistance}px; pointer-events: none; z-index: 9;
          `;
          cardEl.appendChild(ripple);
          gsap.to(ripple, { scale: 1, opacity: 0, duration: 0.6, ease: 'power2.out', onComplete: () => ripple.remove() });
        });
      });
    }

    // --- Global Cursor Spotlight Follow Core System Link ---
    if (globalProps.enableSpotlight && !shouldDisableAnimations) {
      const spotlight = document.createElement('div');
      spotlight.style.cssText = `
        position: fixed; width: 600px; height: 600px; border-radius: 50%; pointer-events: none;
        background: radial-gradient(circle, rgba(${globalProps.glowColor}, 0.1) 0%, transparent 70%);
        z-index: 100; opacity: 0; transform: translate(-50%, -50%); mix-blend-mode: screen;
      `;
      document.body.appendChild(spotlight);

      const proximity = globalProps.spotlightRadius * 0.5;
      const fadeDistance = globalProps.spotlightRadius * 0.75;

      document.addEventListener('mousemove', (e) => {
        const activeCards = document.querySelectorAll('.card-element');
        let minDistance = Infinity;

        activeCards.forEach(card => {
          const cardRect = card.getBoundingClientRect();
          const centerX = cardRect.left + cardRect.width / 2;
          const centerY = cardRect.top + cardRect.height / 2;
          const distance = Math.hypot(e.clientX - centerX, e.clientY - centerY) - Math.max(cardRect.width, cardRect.height) / 2;
          const effectiveDistance = Math.max(0, distance);

          minDistance = Math.min(minDistance, effectiveDistance);

          let glowIntensity = 0;
          if (effectiveDistance <= proximity) {
            glowIntensity = 1;
          } else if (effectiveDistance <= fadeDistance) {
            glowIntensity = (fadeDistance - effectiveDistance) / (fadeDistance - proximity);
          }

          const relativeX = ((e.clientX - cardRect.left) / cardRect.width) * 100;
          const relativeY = ((e.clientY - cardRect.top) / cardRect.height) * 100;
          card.style.setProperty('--glow-x', `${relativeX}%`);
          card.style.setProperty('--glow-y', `${relativeY}%`);
          card.style.setProperty('--glow-intensity', glowIntensity.toString());
        });

        gsap.to(spotlight, { left: e.clientX, top: e.clientY, duration: 0.1 });
        const targetOpacity = minDistance <= proximity ? 0.8 : minDistance <= fadeDistance ? ((fadeDistance - minDistance) / (fadeDistance - proximity)) * 0.8 : 0;
        gsap.to(spotlight, { opacity: targetOpacity, duration: 0.2 });
      });

      document.addEventListener('mouseleave', () => {
        document.querySelectorAll('.card-element').forEach(c => c.style.setProperty('--glow-intensity', '0'));
        gsap.to(spotlight, { opacity: 0, duration: 0.3 });
      });
    }

    // Initialize Application Layout Mount
    window.addEventListener('DOMContentLoaded', () => {
      compilePortfolioShowcase(projectsDataset);
    });

    window.addEventListener('resize', () => {
      isMobile = window.innerWidth <= MOBILE_BREAKPOINT;
    });
  </script>
</body>
</html>
