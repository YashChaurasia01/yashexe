    <!-- ================= NAVBAR ================= -->
    <div class="nav-wrap">
        <nav class="nav-glass">
            <a href="../index.html#working-style" class="nav-logo" title="Back to portfolio">
                <div class="logo-mark"><img src="../static/img/logo.webp" alt="Logo" class="logo"></div>
                <span class="logo-label">Yash Chaurasia's <strong
                        style="color: var(--c3);">Certifications.</strong></span>
            </a>


            <div class="nav-actions">
                <ul class="nav-socials" style="list-style:none; display:flex; gap:0.85rem;">
                    <li><a href="https://github.com/YashChaurasia01" target="_blank" rel="noopener noreferrer"
                            aria-label="GitHub"><i class="fa-brands fa-github"></i></a></li>
                    <li><a href="https://linkedin.com/in/yashchaurasia01" target="_blank" rel="noopener noreferrer"
                            aria-label="LinkedIn"><i class="fa-brands fa-linkedin"></i></a></li>
                    <li><a href="https://instagram.com/yashc.exe" target="_blank" rel="noopener noreferrer"
                            aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a></li>
                    <li><a href="https://mail.google.com/mail/?view=cm&fs=1&to=xukyosho@gmail.com" aria-label="Email"><i
                                class="fa-solid fa-envelope"></i></a>
                    </li>
                </ul>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </nav>
    </div>

    <!-- ================= HERO ================= -->
    <section class="hero">
        <div class="eyebrow">Credentials</div>
        <h1>Certifications</h1>
        <p>A collection of courses, workshops, and programs I've completed — click any card for a closer look, or open
            the
            original file.</p>
    </section>

    <!-- ================= FILTERS ================= -->
    <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="image">Images</button>
        <button class="filter-btn" data-filter="pdf">PDFs</button>
    </div>

    <!-- ================= CERT GRID ================= -->
    <section class="cert-grid" id="certGrid"></section>

    <!-- ================= MODAL ================= -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalTitle">Certificate</h3>
                <button class="close-btn" id="modalClose" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <a id="modalOpenFull" href="#" target="_blank" rel="noopener noreferrer">
                    Open original file <i class="fa-solid fa-arrow-up-right-from-square"></i>
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="../static/all-certificate.js" defer></script>
